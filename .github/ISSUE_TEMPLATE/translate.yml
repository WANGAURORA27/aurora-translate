name: 📄 翻译文档
description: 上传 PDF / Word，自动翻译成中文（图、公式位置不变）
title: "[翻译] "
labels: ["translate"]
body:
  - type: markdown
    attributes:
      value: |
        ### 怎么用
        1. **把文件拖进下面的「文件」框**（拖拽即可上传，会自动插入链接）
        2. 选好「输出形式」和「目标语言」
        3. 点提交，等 **1-5 分钟**，机器人会在这条 Issue 下面回复下载链接

        > 单个文件上限 **25MB**（GitHub 附件限制）。超过的话请用 PDF 工具拆分后再传。

  - type: textarea
    id: files
    attributes:
      label: 文件
      description: 直接把 PDF / DOCX 拖到这个框里
      placeholder: 把文件拖到这里（或粘贴一个可公开下载的链接）
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 输出形式
      description: |
        原位版式保留 = 译文覆盖原文，图片/公式/表格位置完全不动（教材通读首选）
        双语对照 = 原文与译文对照（精读、校对）
        扫描版 OCR = 整页是图片的老书/扫描件
      options:
        - 原位版式保留
        - 双语对照
        - 扫描版 OCR 翻译
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: 目标语言
      options:
        - 简体中文
        - 繁體中文
        - English
    validations:
      required: true
