name: 线上自检

# 部署完网页端后点一下它，会真的走一遍：首页 → 口令门 → 上传 → 等翻译 → 下载译文并检查内容。
# 用的是仓库里的样例文件，一次大概花几厘钱。
#
# 需要的仓库 Secret：
#   SITE_PASSWORD  ← 网页端的使用口令（和 Worker 上的 PASSWORD 一致）
# 需要的仓库 Variable：
#   WORKER_URL     ← 网页端地址（deploy.sh 会自动写好）

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: 要检查的网页端地址（留空则用仓库 Variable 里的 WORKER_URL）
        required: false
      mode:
        description: 用哪种输出形式自检
        required: false
        default: inplace
        type: choice
        options: [inplace, bilingual, ocr]

permissions:
  contents: read
  packages: read                # 从 GHCR 拉运行环境镜像

# 容器 job 的默认 shell 是 sh（dash 不支持 `set -o pipefail`），自检脚本里用到了，
# 所以显式切回 bash。
defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ghcr.io/wangaurora27/aurora-translate-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # 原来这里有 actions/setup-python@v5；换成容器后必须删掉（工具缓存里的那份
      # python 会抢到 PATH 前面，看不到镜像里装的 pymupdf）。
      - name: 环境自检（依赖来自镜像）
        run: |
          set -euo pipefail
          echo "运行在容器镜像里："
          tesseract --version | head -1
          python -c "import fitz, docx; print('deps ok · pymupdf', fitz.__version__)"
          curl --version | head -1
          echo "自检通过 ✓"

      - name: 全链路自检
        env:
          WORKER: ${{ inputs.worker_url || vars.WORKER_URL }}
          PW: ${{ secrets.SITE_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [ -n "$WORKER" ] || { echo "::error::没有网页端地址：请填 worker_url，或先跑 cf/deploy.sh"; exit 1; }
          [ -n "$PW" ] || { echo "::error::仓库 Secret 里缺 SITE_PASSWORD"; exit 1; }
          WORKER="${WORKER%/}"
          echo "检查地址：$WORKER"

          echo "── 1. 首页 ──"
          code=$(curl -sS -o page.html -w '%{http_code}' --max-time 60 "$WORKER/")
          [ "$code" = "200" ] || { echo "::error::首页返回 $code"; exit 1; }
          grep -q "Aurora" page.html || { echo "::error::首页内容不对"; exit 1; }
          echo "  200 且内容正常 ✓"

          echo "── 2. 口令门 ──"
          bad=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -H 'x-password: 故意写错' "$WORKER/api/verify")
          [ "$bad" = "401" ] || { echo "::error::错误口令没有被拒绝（返回 $bad）"; exit 1; }
          echo "  错误口令被拒（401）✓"
          curl -fsS --max-time 60 -H "x-password: $PW" "$WORKER/api/verify" > /dev/null
          echo "  正确口令通过 ✓"

          echo "── 3. 上传样例并派活 ──"
          resp=$(curl -fsS --max-time 300 -X PUT "$WORKER/api/upload" \
            -H "x-password: $PW" -H 'x-filename: smoke-test.pdf' \
            -H "x-mode: $MODE" -H 'x-target: %E4%B8%AD%E6%96%87' \
            --data-binary @samples/demo.pdf)
          JOB=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "  任务号 $JOB"
          echo "$JOB" > job.txt

          echo "── 4. 等翻译（最多 15 分钟）──"
          ready=0
          for i in $(seq 1 90); do
            st=$(curl -fsS --max-time 60 -H "x-password: $PW" "$WORKER/api/status?id=$JOB")
            status=$(printf '%s' "$st" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            note=$(printf '%s' "$st" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("note",""))')
            # 页面靠 phase/stepIndex 显示"正在干嘛"，自检也要能看到它
            phase=$(printf '%s' "$st" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("phase",""))')
            step=$(printf '%s' "$st" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("%s/%s" % (d.get("stepIndex",0), d.get("stepTotal",0)))')
            echo "  [$i] $status · $phase （第 $step 步） $note"
            [ -n "$phase" ] && saw_phase=1
            [ "$status" = "done" ] && { ready=1; printf '%s' "$st" > status.json; break; }
            [ "$status" = "failed" ] && { echo "::error::任务失败：$note"; exit 1; }
            sleep 10
          done
          [ "$ready" = "1" ] || { echo "::error::等太久还没完成"; exit 1; }
          [ "${saw_phase:-0}" = "1" ] || echo "::warning::整个过程中没看到阶段文字（phase）为空"

          echo "── 5. 下载译文并检查 ──"
          # 任务记录已经 done，不代表译文块已经跨机房同步到位：Worker 的 /api/download
          # 这时返回 409（"译文正在同步，请 10 秒后再点一次下载"）。以前这里只下一次，
          # 撞上就整个自检变红 —— 实测踩到过（run 36554185773），历史上也红过两次。
          # 只在 409 上重试，其它状态码立刻失败，免得把真问题掩盖成"等一等就好了"。
          dl=0
          for i in $(seq 1 8); do
            code=$(curl -sS --max-time 600 -o out.bin -w '%{http_code}' \
                     "$WORKER/api/download?id=$JOB&password=$PW") || true
            if [ "$code" = "200" ]; then dl=1; break; fi
            [ "$code" = "409" ] || { echo "::error::下载失败：HTTP ${code:-（curl 没返回状态码）}"; exit 1; }
            echo "  第 $i 次还是 409（译文还没同步过来），等 10 秒再试…"
            sleep 10
          done
          [ "$dl" = "1" ] || { echo "::error::下载一直 409，译文迟迟没同步过来"; exit 1; }
          ls -l out.bin
          # pymupdf 已经在运行环境镜像里，这里不用再 pip install（原来是每次现装）。
          # 真缺了的话下面 import fitz 会立刻报错，不会静默跳过校验。
          python3 - <<'PY'
          import json, re, sys
          import fitz

          stats = json.load(open("status.json")).get("stats") or {}
          doc = fitz.open("out.bin")
          text = "".join(p.get_text() for p in doc)
          zh = len(re.findall(r"[\u4e00-\u9fff]", text))
          math = "".join(s for s in "√∂∆⊂∈∑∫≈≤" if s in text)
          print("  页数 %s，中文字符 %d，数学符号 %s" % (doc.page_count, zh, math or "（无）"))
          print("  统计 %s" % json.dumps(stats, ensure_ascii=False))
          if zh < 20:
              print("::error::译文里几乎没中文，可疑"); sys.exit(1)
          if len(math) < 6:
              print("::error::数学符号丢了（只找到 %r）" % math); sys.exit(1)
          print("  ✓ 译文内容正常")
          PY

          {
            echo "## 线上自检通过"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 地址 | \`$WORKER\` |"
            echo "| 任务 | \`$JOB\` |"
            echo "| 模式 | $MODE |"
          } >> "$GITHUB_STEP_SUMMARY"
