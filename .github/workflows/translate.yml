name: 文档翻译

# 网页端（Cloudflare Worker）派下来的任务带 job_id，把它写进运行标题，
# Worker 就能在运行列表里认领"这次是我派的那个任务"，进而在页面上显示进度。
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.job_id != ''
  && format('云端任务 {0}', inputs.job_id)
  || (github.event.issue.number && format('Issue #{0}', github.event.issue.number))
  || '手动运行' }}

# 怎么用：在仓库里新建 Issue（选「📄 翻译文档」模板）→ 把文件拖进去 → 等机器人回复下载链接。
# 只有仓库所有者与协作者（Collaborator）能触发；其他人提交会被机器人礼貌拒绝。
# 网页端（cf/ 里那个 Worker）走的是下面 cloud 这个 job：文件存 R2，不落 git。
#
# 需要的仓库 Secret：
#   PROFILES_JSON  ← 你的 profiles.json 全文（含 API 密钥），见 README 的配置说明
#   AGENT_KEY      ← 网页端与这里约定的内部密钥（和 Worker 上的一致）
# 需要的仓库 Variable：
#   WORKER_URL     ← 网页端的地址，例如 https://aurora-translate.xxx.workers.dev
# 可选：
#   DEFAULT_PROFILE  指定默认用哪个通道代号（不设则用 profiles 里第一个可用的）

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:            # 手动跑（自己调试用），或被网页端调用
    inputs:
      file_url:
        description: 文件直链（GitHub 附件链接或任何可公开下载的 URL）
        required: false
      job_id:
        description: 云端任务编号（由网页端自动填入，正常不用手填）
        required: false
      mode:
        description: 输出形式
        required: false
        default: inplace
        type: choice
        options: [inplace, bilingual, ocr]
      target:
        description: 目标语言（云端任务用；留空按简体中文）
        required: false

permissions:
  contents: write               # 把译文推到 results 分支
  issues: write                 # 在 Issue 下评论、打标签

# 同一个 Issue 只跑一个任务；不同 Issue 可以并行
concurrency:
  group: aurora-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  translate:
    # 只处理带 translate 标签的 Issue（Issue 模板会自动打上这个标签）；
    # 网页端派下来的任务（带 job_id）走下面的 cloud，不在这里重复跑一遍。
    if: >
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'translate')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. 身份校验：公开仓库任何人都能开 Issue，这里把住"谁能用我的密钥" ──
      - name: 身份校验
        id: gate
        env:
          ASSOC: ${{ github.event.issue.author_association }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "ok=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "ok=0" >> "$GITHUB_OUTPUT"
              gh issue comment "$ISSUE" --body "抱歉，这个仓库的翻译额度只对**协作者**开放（当前身份：\`$ASSOC\`）。想自己用的话，可以 fork 这个仓库并配上你自己的 API 密钥，方法见 README。"
              gh issue close "$ISSUE"
              ;;
          esac

      - name: 解析 Issue 里的文件与选项
        if: steps.gate.outputs.ok == '1'
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
          MANUAL_URL: ${{ inputs.file_url }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("BODY") or ""
          manual = os.environ.get("MANUAL_URL") or ""
          mode = (os.environ.get("MANUAL_MODE") or "").strip()

          def section(name):
              """从 Issue 表单渲染出的 markdown 里取某一节的内容。"""
              m = re.search(r"###\s*%s\s*\n+(.*?)(?=\n###|\Z)" % re.escape(name), body, re.S)
              return (m.group(1).strip() if m else "")

          # 按优先级找文件链接：
          #   1) markdown 链接 [书名.pdf](URL) —— 拖拽上传就是这样，链接文字就是原文件名
          #   2) 任何以 .pdf/.docx 结尾的链接（用户可以贴自己的下载地址）
          #   3) GitHub 附件的裸链接（没有扩展名的那种）
          md = re.search(r"\[([^\]\n]{1,160}?\.(?:pdf|docx))\]"
                         r"\((https?://[^)\s]+)\)", body, re.I)
          any_file = re.findall(r"https?://[^\s\)\]]+\.(?:pdf|docx)(?:\?[^\s\)\]]*)?",
                                body, re.I)
          attach = re.findall(r"https://(?:github\.com/user-attachments/assets/[\w.-]+"
                              r"|user-images\.githubusercontent\.com/[\w./%-]+)", body)

          name_hint = ""
          urls: list[str] = []
          if md:
              name_hint = md.group(1).strip()
              urls.append(md.group(2))
          for u in list(any_file) + list(attach):
              if u not in urls:
                  urls.append(u)

          if manual:
              urls.insert(0, manual.strip())

          mode_text = section("输出形式") or mode or "原位版式保留"
          if "OCR" in mode_text or "ocr" in mode_text.lower():
              mode = "ocr"
          elif "双语" in mode_text or "bilingual" in mode_text.lower():
              mode = "bilingual"
          else:
              mode = "inplace"

          target = section("目标语言") or "简体中文"
          target = {"繁體中文": "zh-Hant", "English": "en"}.get(target, "zh-Hans")

          if not urls:
              print("::error::Issue 里没有找到文件链接（请把 PDF/DOCX 直接拖进「文件」框）")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("url=%s\n" % urls[0])
              fh.write("urls=%s\n" % " ".join(urls))
              fh.write("mode=%s\n" % mode)
              fh.write("target=%s\n" % target)
              fh.write("name=%s\n" % re.sub(r"[^\w.\- ]+", "_", name_hint)[:80])
          print("文件链接：", urls[0])
          print("模式：", mode, "目标语言：", target)
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == '1'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == '1'
        with:
          python-version: "3.10"
          cache: pip

      # ── 2. 装系统依赖：OCR 引擎与中文字体（PDF 翻译与扫描件都要用）──
      - name: 安装系统依赖
        if: steps.gate.outputs.ok == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim \
               fonts-arphic-uming fonts-dejavu-core

      - name: 安装 Python 依赖
        if: steps.gate.outputs.ok == '1'
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: 下载待翻译文件
        if: steps.gate.outputs.ok == '1'
        id: fetch
        env:
          URL: ${{ steps.parse.outputs.url }}
          HINT: ${{ steps.parse.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p work
          # 从 URL 猜扩展名；猜不到就看原文件名的后缀，再不行按 PDF
          ext=$(echo "$URL" | grep -oiE '\.(pdf|docx)(\?|$)' | head -1 | tr -d '?')
          if [ -z "$ext" ] && [ -n "$HINT" ]; then ext=".${HINT##*.}"; fi
          [ -n "$ext" ] || ext=".pdf"
          curl -fL --retry 3 --max-time 600 -o "work/_dl$ext" "$URL"
          size=$(stat -c%s "work/_dl$ext")
          echo "来源：$URL"
          echo "大小：$((size/1024)) KB"
          if [ "$size" -gt $((25*1024*1024)) ]; then
            echo "::error::文件超过 25MB（GitHub 附件上限），请拆分后再传"; exit 1
          fi
          # 保留原文件名（便于用户认出是哪本书）；没有就退回 input.<ext>
          if [ -n "$HINT" ]; then base="${HINT%.*}$ext"; else base="input$ext"; fi
          mv "work/_dl$ext" "work/$base"
          echo "name=$base" >> "$GITHUB_OUTPUT"

      - name: 翻译
        if: steps.gate.outputs.ok == '1'
        id: run
        env:
          DOCBRIDGE_PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
          DEFAULT_PROFILE: ${{ vars.DEFAULT_PROFILE }}
          MODE: ${{ steps.parse.outputs.mode }}
          TARGET: ${{ steps.parse.outputs.target }}
          NAME: ${{ steps.fetch.outputs.name }}
        run: |
          set -euo pipefail
          # 注意 `${NAME##*.}` 只给出扩展名、**不含点号**，少写一个点就会产出没有后缀的文件
          stem="${NAME%.*}"
          ext="${NAME##*.}"
          out="work/${stem}_${MODE}.${ext}"
          python3 tools/translate_cli.py \
            --input "work/$NAME" --output "$out" \
            --mode "$MODE" --target "$TARGET" \
            --profile "${DEFAULT_PROFILE:-}" \
            --options '{"prefetch": true, "shared_cache": false}'
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # ── 3. 交付：推到 results 分支（公开仓库可直接用链接下载）+ 附 artifact ──
      - name: 发布译文到 results 分支
        if: steps.gate.outputs.ok == '1' && success()
        env:
          OUT: ${{ steps.run.outputs.out }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          base=$(basename "$OUT")
          dest="results/${ISSUE:-manual}"
          git config user.name "aurora-translate[bot]"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin results --depth=1 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/results; then
            git checkout -q -b results origin/results
          else
            git checkout -q --orphan results && git rm -rq --cached . || true
          fi
          mkdir -p "$dest"
          cp "$OUT" "$dest/$base"
          git add -f "$dest/$base"
          git commit -qm "翻译结果：$base（来自 Issue ${ISSUE:-手动触发}）"
          git push -q origin results
          echo "raw=https://github.com/${GITHUB_REPOSITORY}/raw/results/$dest/$base" >> "$GITHUB_OUTPUT"
        id: publish

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == '1' && success()
        with:
          name: translated-${{ github.event.issue.number || github.run_id }}
          path: ${{ steps.run.outputs.out }}
          retention-days: 7

      # ── 4. 回帖 ──
      - name: 在 Issue 下回复下载链接
        if: steps.gate.outputs.ok == '1' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RAW: ${{ steps.publish.outputs.raw }}
        run: |
          [ -n "$ISSUE" ] || exit 0
          # 文件名里可能有空格或中文，直接把 URL 写进正文会点不开 —— 用 markdown 链接 + URL 编码
          LINK=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=':/'))" "$RAW")
          NAME=$(basename "$RAW")
          gh issue comment "$ISSUE" --body "✅ **翻译完成**

          **[⬇ 下载 $NAME]($LINK)**

          链接来自 \`results\` 分支，公开仓库无需登录，**7 天后自动清理**。
          运行记录（含完整日志与统计）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --add-label "已完成" 2>/dev/null || true
          gh issue close "$ISSUE"

      - name: 失败时在 Issue 下说明原因
        if: steps.gate.outputs.ok == '1' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          [ -n "$ISSUE" ] || exit 0
          gh issue comment "$ISSUE" --body "❌ 翻译失败。请点上面的运行记录查看日志；
          常见原因：文件加密/损坏、超过 25MB、密钥额度不足、或这份 PDF 需要改用「扫描版 OCR」模式。"

  # ── 网页端派下来的任务 ─────────────────────────────────────────────────
  # 与上面那条路互不干扰：原件从 Worker 取、译文回传给 Worker，都不落 git，
  # 所以不受 Issue 附件 25MB 的限制（上限由 Worker 那边把关）。
  cloud:
    if: github.event_name == 'workflow_dispatch' && inputs.job_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim \
               fonts-arphic-uming fonts-dejavu-core

      - name: 安装 Python 依赖
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: 从网页端取原件
        id: fetch
        env:
          WORKER: ${{ vars.WORKER_URL }}
          KEY: ${{ secrets.AGENT_KEY }}
          JOB: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          [ -n "$WORKER" ] || { echo "::error::仓库 Variable 里还没设置 WORKER_URL"; exit 1; }
          mkdir -p work
          # 云端存储是跨机房最终一致的（最长约 60 秒），刚传完可能还取不到 —— 重试几次
          ok=0
          for i in $(seq 1 10); do
            if curl -fsSL --retry 2 --max-time 900 -D work/headers.txt \
                 -o work/_input -H "x-agent-key: $KEY" "$WORKER/api/input/$JOB"; then
              ok=1; break
            fi
            echo "第 $i 次取件没成功，等 12 秒再试…"
            sleep 12
          done
          [ "$ok" = "1" ] || { echo "::error::取不到原件（云端还在同步，或 WORKER_URL / AGENT_KEY 不对）"; exit 1; }
          # 原文件名由 Worker 放在 x-filename 头里（URL 编码过，可能有中文）
          name=$(python3 - <<'PY'
          import urllib.parse
          for line in open("work/headers.txt", encoding="utf-8", errors="ignore"):
              if line.lower().startswith("x-filename:"):
                  print(urllib.parse.unquote(line.split(":", 1)[1].strip()))
                  break
          else:
              print("input.pdf")
          PY
          )
          mv work/_input "work/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "大小 $(du -h "work/$name" | cut -f1)"

      - name: 回报"开始翻译"
        env:
          WORKER: ${{ vars.WORKER_URL }}
          KEY: ${{ secrets.AGENT_KEY }}
          JOB: ${{ inputs.job_id }}
        run: |
          curl -fsS -X POST "$WORKER/api/report/$JOB" -H "x-agent-key: $KEY" \
            -H 'content-type: application/json' \
            -d '{"status":"running","note":"正在翻译，这个页面每几秒自动刷新"}' || true

      - name: 翻译
        id: run
        env:
          DOCBRIDGE_PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
          DOCBRIDGE_STATS_OUT: work/stats.json
          DEFAULT_PROFILE: ${{ vars.DEFAULT_PROFILE }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          NAME: ${{ steps.fetch.outputs.name }}
        run: |
          set -euo pipefail
          case "${TARGET:-}" in
            英文) t=en ;; 日文) t=ja ;; 韩文) t=ko ;; 法文) t=fr ;;
            德文) t=de ;; 西班牙文) t=es ;; 俄文) t=ru ;;
            "") t=zh-Hans ;; *) t="$TARGET" ;;
          esac
          # `${NAME##*.}` 不含点号，别漏了
          stem="${NAME%.*}"
          ext="${NAME##*.}"
          out="work/${stem}_${MODE}.${ext}"
          python3 tools/translate_cli.py \
            --input "work/$NAME" --output "$out" \
            --mode "$MODE" --target "$t" \
            --profile "${DEFAULT_PROFILE:-}" \
            --options '{"prefetch": true, "shared_cache": false}'
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "### 统计" >> "$GITHUB_STEP_SUMMARY"
          cat work/stats.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 回传译文
        if: success()
        env:
          WORKER: ${{ vars.WORKER_URL }}
          KEY: ${{ secrets.AGENT_KEY }}
          JOB: ${{ inputs.job_id }}
          OUT: ${{ steps.run.outputs.out }}
        run: |
          set -euo pipefail
          base=$(basename "$OUT")
          encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$base")
          curl -fsS --retry 3 --max-time 1800 -X POST "$WORKER/api/result/$JOB" \
            -H "x-agent-key: $KEY" -H "x-filename: $encoded" \
            -H 'content-type: application/octet-stream' \
            --data-binary @"$OUT"
          echo "已回传 $base（$(du -h "$OUT" | cut -f1)）"

      - name: 回传统计
        if: success()
        env:
          WORKER: ${{ vars.WORKER_URL }}
          KEY: ${{ secrets.AGENT_KEY }}
          JOB: ${{ inputs.job_id }}
        run: |
          [ -f work/stats.json ] || echo '{}' > work/stats.json
          body=$(python3 -c 'import json,sys; print(json.dumps({"status":"done","note":"翻译完成","stats":json.load(open("work/stats.json"))}))')
          curl -fsS -X POST "$WORKER/api/report/$JOB" -H "x-agent-key: $KEY" \
            -H 'content-type: application/json' -d "$body" || true

      - name: 失败时告诉页面原因
        if: failure()
        env:
          WORKER: ${{ vars.WORKER_URL }}
          KEY: ${{ secrets.AGENT_KEY }}
          JOB: ${{ inputs.job_id }}
        run: |
          note="翻译失败：文件加密/损坏、语言不支持、额度用尽，或这份 PDF 需要改用「扫描版 OCR」。点日志链接看详细原因"
          curl -fsS -X POST "$WORKER/api/report/$JOB" -H "x-agent-key: $KEY" \
            -H 'content-type: application/json' \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"status":"failed","note":sys.argv[1]}))' "$note")" || true
